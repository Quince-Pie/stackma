version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:41'
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:47'
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:53'
      timezone: Etc/UTC
    cooldown:
      default-days: 3
