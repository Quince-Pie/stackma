name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag on main (vMAJOR.MINOR.PATCH)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: stackma-release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: '[[ "$WORKFLOW_REF" == refs/heads/main ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve an existing tag in the approved main history
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MAIN_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$commit" "$MAIN_COMMIT"
          printf 'commit=%s\ntag=%s\n' "$commit" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the release commit
    needs: resolve
    # Same-commit semantics as $/; retain actionlint's reusable-input validation.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      release-tag: ${{ needs.resolve.outputs.tag }}

  sign:
    name: Sign and verify with Mozilla
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 35
    outputs:
      signed-artifact-id: ${{ steps.signed.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Install the locked toolchain
        run: bash scripts/ci/install-nix.sh
      - name: Install locked dependencies and the acceptance browser
        run: |
          nix develop --no-update-lock-file --command npm ci --ignore-scripts
          bash scripts/ci/install-firefox.sh
      - name: Download this run's verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.release-input-id }}
          path: artifacts/release-input
          digest-mismatch: error
      - name: Submit or resume Mozilla signing
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: nix develop --no-update-lock-file --command node scripts/release/sign.js
      - name: Verify a permanent installation and assemble release assets
        run: |
          nix develop --no-update-lock-file --command node scripts/package-test.js --signed --xpi="artifacts/release-signed/stackma-${RELEASE_TAG#v}.xpi" --output=artifacts/release-verification.json
          nix develop --no-update-lock-file --command node scripts/release/assemble.js
      - name: Preserve the verified signed release
        id: signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-signed/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve signature verification diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-verification.json
            artifacts/release-verification.json.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish the verified signed release
    needs: [resolve, sign]
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 20
    permissions:
      contents: write # Create and publish releases and their assets in this job only.
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the locked release tools
        run: bash scripts/ci/install-nix.sh
      - name: Download the signed and verified release by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-artifact-id }}
          path: artifacts/release-signed
          digest-mismatch: error
      - name: Reconcile, publish and verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: nix develop .#release --no-update-lock-file --command node scripts/release/publish.js
      - name: Preserve publication verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-publication.json
          if-no-files-found: ignore
          retention-days: 30
