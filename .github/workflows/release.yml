name: Publish release
# Resume approved releases finds its own dispatches by this exact title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish release {0}', inputs.tag) || github.event.pull_request.title }}

# Audited in docs/listed-1.1.7.md: merged same-repo source must be on protected
# main before any write/secret job. No unmerged or fork code is executed.
on: # zizmor: ignore[dangerous-triggers]
  # Only merged, same-repository release PRs pass the job and source guards.
  # The default-branch event context can enter our main-only environments;
  # ordinary pull_request deployments retain a refs/pull/*/merge policy ref.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to resume. For a missing tag, also supply its merged release PR. Start new versions with Release.
        type: string
        required: true
      pull-request:
        description: Optional merged release PR number, only to recover a missing tag with the current controller.
        type: string
        required: false
        default: ''
      supersede:
        description: Leave empty. Only to replace an AMO version still awaiting review, enter that version (e.g. 1.1.4); Mozilla disables it.
        type: string
        required: false
        default: ''
      chrome-supersede:
        description: Leave empty. Only to replace a Chrome Web Store version still in review, enter that version; its review is cancelled.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: stackma-release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve the approved release source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Inspect an explicitly selected merged release PR during recovery.
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      create-tag: ${{ steps.resolve.outputs.create-tag }}
    steps:
      - name: Require release from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: '[[ "$WORKFLOW_REF" == refs/heads/main ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install the locked release tools
        run: bash scripts/ci/install-nix.sh
      - name: Resolve the merged release PR or an existing tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RECOVERY_PR: ${{ inputs.pull-request }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#release --no-update-lock-file --command node scripts/release/resolve.js

  verify:
    name: Verify the release commit
    needs: resolve
    # Same-commit semantics as $/; retain actionlint's reusable-input validation.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      release-tag: ${{ needs.resolve.outputs.tag }}

  tag:
    name: Tag the verified release commit
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create only the verified tag; existing tags must match.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the locked release tools
        run: bash scripts/ci/install-nix.sh
      - name: Create or reconcile the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          CREATE_TAG: ${{ needs.resolve.outputs.create-tag }}
        run: nix develop .#release --no-update-lock-file --command node scripts/release/tag.js

  sign:
    name: Sign and verify with Mozilla
    needs: [resolve, verify, tag]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 35
    outputs:
      signed-artifact-id: ${{ steps.signed.outputs.artifact-id }}
      state: ${{ steps.amo.outputs.state }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out frozen product files for installation verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
          path: release-source
      - name: Install the locked toolchain
        run: bash scripts/ci/install-nix.sh
      - name: Install locked dependencies and the acceptance browser
        run: |
          nix develop --no-update-lock-file --command npm ci --ignore-scripts
          bash scripts/ci/install-firefox.sh
      - name: Download this run's verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.release-input-id }}
          path: artifacts/release-input
          digest-mismatch: error
      - name: Submit or resume Mozilla signing
        id: amo
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          SUPERSEDE_PENDING: ${{ inputs.supersede }}
        run: nix develop --no-update-lock-file --command node scripts/release/sign.js
      - name: Verify a permanent installation and assemble release assets
        if: steps.amo.outputs.state == 'approved-and-signed'
        run: |
          packages=(artifacts/release-signed/*.xpi)
          (( ${#packages[@]} == 1 ))
          [[ -f "${packages[0]}" ]]
          nix develop --no-update-lock-file --command node scripts/package-test.js --source-root=release-source --signed --xpi="${packages[0]}" --output=artifacts/release-verification.json
          nix develop --no-update-lock-file --command node scripts/release/assemble.js
      - name: Preserve the verified signed release
        id: signed
        if: steps.amo.outputs.state == 'approved-and-signed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-signed/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve signature verification diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-verification.json
            artifacts/release-verification.json.log
          if-no-files-found: ignore
          retention-days: 14

  chrome:
    name: Submit to the Chrome Web Store
    needs: [resolve, verify, tag]
    runs-on: ubuntu-24.04
    environment: release-chrome-web-store
    timeout-minutes: 20
    permissions:
      contents: read # Read the release tag before each store write.
      id-token: write # Exchange this job's OIDC token for a short-lived store credential.
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the locked release tools
        run: bash scripts/ci/install-nix.sh
      - name: Download this run's verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.release-input-id }}
          path: artifacts/release-input
          digest-mismatch: error
      - name: Submit or reconcile the tested Chrome package
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CHROME_SUPERSEDE_PENDING: ${{ inputs.chrome-supersede }}
        run: nix develop .#release --no-update-lock-file --command node scripts/release/chrome-submit.js

  publish:
    name: Publish the verified signed release
    needs: [resolve, sign]
    if: needs.sign.outputs.state == 'approved-and-signed'
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 20
    permissions:
      contents: write # Create and publish releases and their assets in this job only.
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the locked release tools
        run: bash scripts/ci/install-nix.sh
      - name: Download the signed and verified release by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.signed-artifact-id }}
          path: artifacts/release-signed
          digest-mismatch: error
      - name: Reconcile, publish and verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: nix develop .#release --no-update-lock-file --command node scripts/release/publish.js
      - name: Preserve publication verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-publication.json
          if-no-files-found: ignore
          retention-days: 30
